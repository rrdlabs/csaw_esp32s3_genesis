<svg xmlns="http://www.w3.org/2000/svg" width="1498" height="904" viewBox="0 0 1498 904" role="img" aria-label="CsAW architecture overview">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1426"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
  </defs>
  <rect width="1498" height="904" rx="24" fill="url(#bg2)"/>
  <text x="749" y="76" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">CsAW — ESP32-S3 Agent Architecture</text>

  <g font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#e8eefc" text-anchor="middle">
    <rect x="70" y="150" width="340" height="120" rx="16" fill="#1b2b4d" stroke="#36d1dc" stroke-width="2"/>
    <text x="240" y="210">On-screen Chat / Keyboard</text>
    <text x="240" y="245" font-size="20" fill="#9fb3d9">Touch display route</text>

    <rect x="580" y="150" width="340" height="120" rx="16" fill="#1b2b4d" stroke="#36d1dc" stroke-width="2"/>
    <text x="750" y="210">Voice Route</text>
    <text x="750" y="245" font-size="20" fill="#9fb3d9">(under development)</text>

    <rect x="1090" y="150" width="340" height="120" rx="16" fill="#1b2b4d" stroke="#36d1dc" stroke-width="2"/>
    <text x="1260" y="210">Serial CLI</text>
    <text x="1260" y="245" font-size="20" fill="#9fb3d9">diagnostics</text>

    <rect x="440" y="390" width="620" height="130" rx="18" fill="#20345c" stroke="#5b86e5" stroke-width="3"/>
    <text x="750" y="445" font-size="32" font-weight="700">Agent Loop + Message Bus</text>
    <text x="750" y="485" font-size="20" fill="#9fb3d9">context builder · tool registry · scheduler</text>

    <rect x="70" y="650" width="400" height="150" rx="16" fill="#1b2b4d" stroke="#36d1dc" stroke-width="2"/>
    <text x="270" y="710">Tools</text>
    <text x="270" y="748" font-size="20" fill="#9fb3d9">files · GPIO · web · cron</text>
    <text x="270" y="780" font-size="20" fill="#9fb3d9">on-demand MicroPython</text>

    <rect x="550" y="650" width="400" height="150" rx="16" fill="#1b2b4d" stroke="#36d1dc" stroke-width="2"/>
    <text x="750" y="710">Memory</text>
    <text x="750" y="748" font-size="20" fill="#9fb3d9">SD card: sessions + context</text>
    <text x="750" y="780" font-size="20" fill="#9fb3d9">flash: config + long-term</text>

    <rect x="1030" y="650" width="400" height="150" rx="16" fill="#1b2b4d" stroke="#36d1dc" stroke-width="2"/>
    <text x="1230" y="710">Model Providers</text>
    <text x="1230" y="748" font-size="20" fill="#9fb3d9">Kilo free router (default)</text>
    <text x="1230" y="780" font-size="20" fill="#9fb3d9">OpenCode + fallbacks</text>
  </g>

  <g stroke="#5b86e5" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#5b86e5"/>
      </marker>
    </defs>
    <path d="M240,270 L560,390"/>
    <path d="M750,270 L750,390"/>
    <path d="M1260,270 L940,390"/>
    <path d="M750,520 L270,650"/>
    <path d="M750,520 L750,650"/>
    <path d="M750,520 L1230,650"/>
  </g>
</svg>
